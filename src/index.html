<!doctype html>
<html lang="fr" data-bs-theme="light" data-layout="vertical" data-menu-color="light" data-topbar-color="light"
  data-sidenav-size="default">

<head>
  <meta charset="utf-8">
  <title>TransCI — Transport interurbain</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon3.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    #splash-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      background: white;
      display: flex;
      height: 100%;
      width: 100%;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: all 15s linear;
      overflow: hidden;
    }

    #splash-screen.remove {
      animation: fadeout 0.7s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <div id="splash-screen">
    <img alt="Logo" class="light" src="./assets/images/logotoggle.png" style="height: 10%" />
  </div>
  <script>
    const splashScreen = document.querySelector('#splash-screen')
    if (splashScreen) {
      splashScreen.classList.add('remove')
    }
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
