<div class="modal-header">
  <h5 class="modal-title">Permissions — {{ data.roleLabel }}</h5>
  <button type="button" class="btn-close" aria-label="Fermer" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  @if (loading()) {
    <div class="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
      <p>Chargement des permissions...</p>
    </div>
  } @else {
    <div class="modules">
      @for (mod of modules(); track mod) {
        <div class="module">
          <div class="module-header">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'mod-' + mod"
                [checked]="isModuleAllSelected(mod)"
                (change)="toggleModule(mod, $event)"
              />
              <label class="form-check-label fw-semibold" [for]="'mod-' + mod">{{ mod }}</label>
            </div>
          </div>
          <div class="perms">
            @for (perm of permsByModule(mod); track perm.id) {
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'perm-' + perm.id"
                  [checked]="selectedCodes().has(perm.code)"
                  (change)="togglePermission(perm.code, $event)"
                />
                <label class="form-check-label" [for]="'perm-' + perm.id">
                  {{ perm.libelle }}
                  <span class="code">{{ perm.code }}</span>
                </label>
              </div>
            }
          </div>
        </div>
      }
    </div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="activeModal.dismiss()">Annuler</button>
  <button type="button" class="btn btn-primary" [disabled]="loading() || submitting()" (click)="onSave()">
    @if (submitting()) {
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
    } @else {
      Enregistrer
    }
  </button>
</div>
