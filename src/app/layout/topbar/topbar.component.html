<header class="app-topbar">
  <div class="topbar-menu">
    <div class="d-flex align-items-center gap-3">
      <button
        class="btn-icon d-lg-none"
        type="button"
        aria-label="Ouvrir le menu"
        (click)="toggleMobileMenu()"
      >
        <i class="bi bi-list"></i>
      </button>

      <div class="d-none d-lg-block">
        <h5 class="topbar-page-title mb-0">{{ pageTitle }}</h5>
        <small class="text-muted d-block lh-1">{{ pageCaption }}</small>
      </div>
    </div>

    <div class="d-flex align-items-center gap-1">
      <form class="global-search d-none d-xl-flex" (submit)="onGlobalSearch()">
        <i class="bi bi-search"></i>
        <input
          type="search"
          [(ngModel)]="searchQuery"
          name="globalSearch"
          placeholder="Rechercher..."
          aria-label="Recherche globale"
        />
      </form>

      <button
        class="btn-icon"
        type="button"
        [attr.aria-label]="layoutTheme === 'light' ? 'Activer le thème sombre' : 'Activer le thème clair'"
        (click)="changeTheme()"
      >
        @if (layoutTheme === 'light') {
          <i class="bi bi-moon-stars"></i>
        } @else {
          <i class="bi bi-sun"></i>
        }
      </button>

      <button
        class="btn-icon"
        type="button"
        aria-label="Paramètres d'affichage"
        (click)="settingMenu()"
      >
        <i class="bi bi-sliders"></i>
      </button>

      <div ngbDropdown class="dropdown d-inline-flex">
        <button
          type="button"
          class="topbar-profile"
          ngbDropdownToggle
          aria-label="Profil utilisateur"
        >
          <span class="avatar-circle">{{ getInitials() }}</span>
          <span class="d-none d-md-block text-start lh-sm ms-2">
            <span class="d-block fs-13 fw-semibold text-body">{{ getDisplayName() }}</span>
            <small class="d-block text-muted">{{ user()?.email }}</small>
          </span>
        </button>
        <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end">
          <div class="dropdown-header text-muted">Espace personnel</div>
          <a class="dropdown-item" href="javascript: void(0);" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2 text-danger"></i>
            Déconnexion
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
