<mat-sidenav-container class="shell">
  <mat-sidenav [opened]="sidenavOpened()" mode="side" class="sidenav">
    <div class="brand">TransCI</div>
    <mat-nav-list>
  @for (item of visibleMenuItems(); track item.key) {
    <app-menu-item [item]="item" />
  }
</mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button type="button" (click)="sidenavOpened.set(!sidenavOpened())" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Compagnie de transport interurbain</span>
      <span class="spacer"></span>
      <span class="api-pill" [class.ok]="apiStatus() === 'ok'" [class.down]="apiStatus() === 'down'">
        API {{ apiStatus() === 'ok' ? 'connectée' : apiStatus() === 'down' ? 'indisponible' : '…' }}
      </span>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
